name: StudWorx CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

# a newer push to the same branch cancels the runs still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Install Qt
      uses: jurplel/install-qt-action@v4  
      with:
        version: '5.15.*'
        cache: 'true'
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores
    - name: Generate Makefile
      run: qmake PREFIX=/usr
    - name: Build
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Install
      run: |
        make install INSTALL_ROOT=$PWD/AppDir
    - name: Generate test Makefile
      run: |
        mkdir -p build/testing
        cd build/testing
        qmake ../../source/testing/testing.pro CONFIG+=release CONFIG-=debug
    - name: Build tests
      working-directory: build/testing
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Run tests
      working-directory: build/testing
      run: make check TESTARGS="-o test-results.xml,junitxml -o -,txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-linux-${{ steps.version.outputs.text }}-x64
        path: build/testing/test-results.xml
        if-no-files-found: ignore

  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-22.04
          architecture: amd64
        - runner: ubuntu-22.04-arm
          architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Install Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qttools5-dev-tools libqt5opengl5-dev libqt5svg5 qt5-image-formats-plugins zlib1g-dev
    - name: Build package
      run: resources/packaging/deb/deb.sh build/deb
    - name: Test package
      run: |
        for image in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04
        do
          docker run --rm -v "$PWD/build/deb:/deb" "$image" sh -c 'apt-get update -qq && apt-get install -y -qq /deb/studworx_*.deb > /dev/null && QT_QPA_PLATFORM=offscreen studworx --version'
        done
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: studworx-deb-${{ steps.version.outputs.text }}-${{ matrix.architecture }}
        path: build/deb/studworx_*.deb

  build-rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-22.04
          architecture: x86_64
        - runner: ubuntu-22.04-arm
          architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Build package
      run: |
        docker run --rm -v "$PWD:/src" rockylinux:9 bash -c 'dnf install -y -q epel-release && dnf install -y -q qt5-qtbase-devel qt5-linguist qt5-qtsvg qt5-qtimageformats gcc-c++ make rpm-build zlib-devel findutils && bash /src/resources/packaging/rpm/rpm.sh /src/build/rpm'
        sudo chown -R "$(id -u):$(id -g)" build
    - name: Test package
      run: |
        for image in rockylinux:9 fedora:latest
        do
          docker run --rm -v "$PWD/build/rpm:/rpm" "$image" sh -c 'dnf install -y -q /rpm/studworx-*.rpm && QT_QPA_PLATFORM=offscreen studworx --version'
        done
        docker run --rm -v "$PWD/build/rpm:/rpm" opensuse/tumbleweed sh -c 'zypper --non-interactive install --allow-unsigned-rpm /rpm/studworx-*.rpm > /dev/null && QT_QPA_PLATFORM=offscreen studworx --version'
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: studworx-rpm-${{ steps.version.outputs.text }}-${{ matrix.architecture }}
        path: build/rpm/studworx-*.rpm

  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-22.04
          architecture: x86_64
        - runner: ubuntu-22.04-arm
          architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Install Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qttools5-dev-tools libqt5opengl5-dev libqt5svg5 qt5-image-formats-plugins zlib1g-dev
    - name: Build package
      run: resources/packaging/appimage/appimage.sh build/appimage
    - name: Test package
      run: |
        docker run --rm -v "$PWD/build/appimage:/appimage" debian:12 sh -c 'apt-get update -qq && apt-get install -y -qq libgl1 libegl1 libfontconfig1 libglib2.0-0 libdbus-1-3 libcups2 > /dev/null && cd /tmp && /appimage/studworx-*.appimage --appimage-extract > /dev/null && QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --version'
        docker run --rm -v "$PWD/build/appimage:/appimage" fedora:latest sh -c 'dnf install -y -q mesa-libGL mesa-libEGL fontconfig glib2 dbus-libs cups-libs && cd /tmp && /appimage/studworx-*.appimage --appimage-extract > /dev/null && QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --version'
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: studworx-appimage-${{ steps.version.outputs.text }}-${{ matrix.architecture }}
        path: build/appimage/studworx-*.appimage

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.*'
        cache: 'true'
    - name: Cache POV-Ray
      uses: actions/cache@v6
      id: cache-povray
      with:
        path: povray
        key: povray-build1
    - name: Download POV-Ray
      if: steps.cache-povray.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/leozide/povray/releases/download/build1/povray
        chmod +x povray
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores
    - name: Generate Makefile
      run: qmake -early QMAKE_DEFAULT_LIBDIRS=$(xcrun -show-sdk-path)/usr/lib QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64" CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
    - name: Build
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Generate test Makefile
      run: |
        mkdir -p build/testing
        cd build/testing
        qmake ../../source/testing/testing.pro CONFIG+=release CONFIG-=debug
    - name: Build tests
      working-directory: build/testing
      run: make -j ${{ steps.cpu-cores.outputs.count }}
    - name: Run tests
      working-directory: build/testing
      run: make check TESTARGS="-o test-results.xml,junitxml -o -,txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-macos-${{ steps.version.outputs.text }}-arm64
        path: build/testing/test-results.xml
        if-no-files-found: ignore
    - name: Build package
      working-directory: build/release
      run: |
        macdeployqt StudWorx.app
        # sign ad hoc so apple silicon starts the deployed bundle
        if [ -f StudWorx.app/Contents/MacOS/povray ]
        then
          codesign --force --sign - StudWorx.app/Contents/MacOS/povray
        fi
        codesign --force --deep --sign - StudWorx.app
        lipo -archs StudWorx.app/Contents/MacOS/StudWorx
        # hdiutil fails now and then on the runners
        for attempt in 1 2 3 4 5
        do
          if hdiutil create -volname StudWorx -srcfolder StudWorx.app -ov -format UDZO studworx-macos-${{ steps.version.outputs.text }}-universal.dmg
          then
            break
          fi
          sleep 10
        done
        test -s studworx-macos-${{ steps.version.outputs.text }}-universal.dmg
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: studworx-macos-${{ steps.version.outputs.text }}-universal
        path: build/release/studworx-macos-*.dmg

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        # aqtinstall 3.3 cannot read Qt 6.11's Windows repository layout.
        version: '6.10.3'
        arch: 'win64_msvc2022_64'
        cache: 'true'
    - name: Cache POV-Ray
      uses: actions/cache@v6
      id: cache-povray
      with:
        path: povconsole64.exe
        key: povray-windows64-207b3a57
    # 64 bit console with the shared memory preview
    - name: Check out POV-Ray
      if: steps.cache-povray.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: leozide/povray
        ref: 207b3a57d5daf9a4330484434a06c98b5d014781
        path: povray-source
    - name: Build POV-Ray
      if: steps.cache-povray.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd povray-source
        sed -i 's|^// #define _CONSOLE|#define _CONSOLE|' windows/povconfig/syspovconfig.h
        sed -i 's|^#define BUILT_BY .*|#define BUILT_BY "StudWorx continuous integration"|; /Please fill in BUILT_BY/d' source/base/build.h
        # msbuild is not on the path
        msbuild="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | head -n 1 | tr -d '\r')"
        "${msbuild}" windows/vs2015/console.vcxproj -m -nologo -verbosity:minimal -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143 -p:WindowsTargetPlatformVersion=10.0
        cp windows/vs2015/bin64/povconsole64.exe ../povconsole64.exe
    - name: Generate Makefile
      run: qmake -spec win32-msvc CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
    - name: Build
      run: |
        nmake /NOLOGO
        if not exist build\release\povconsole64.exe exit /b 1
    - name: Generate test Makefile
      run: |
        mkdir build\testing
        cd build\testing
        qmake ..\..\source\testing\testing.pro -spec win32-msvc CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release
    - name: Build tests
      working-directory: build/testing
      run: nmake /NOLOGO
    - name: Run tests
      working-directory: build/testing
      run: nmake /NOLOGO check "TESTARGS=-o test-results.xml,junitxml -o -,txt"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-windows-${{ steps.version.outputs.text }}-x64
        path: build/testing/test-results.xml
        if-no-files-found: ignore
    - name: Build package
      shell: bash
      run: resources/packaging/windows/windows.sh build/windows
    - name: Build portable package
      shell: bash
      run: resources/packaging/windows/windows-portable.sh build/windows
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: studworx-windows-${{ steps.version.outputs.text }}-x64
        path: build/windows/studworx-windows-*.exe

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build-deb, build-rpm, build-appimage, build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
    - name: Read version
      id: version
      shell: bash
      run: |
        [[ "$(grep -m 1 SW_VERSION_TEXT source/application/sw_global.h)" =~ \"([0-9-]+)\" ]]
        echo "text=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        pattern: studworx-*
        path: packages
        merge-multiple: true
    - name: Write release notes
      shell: bash
      run: |
        # the notice of this version
        state_notice=0
        while IFS= read -r line_notice
        do
          if [[ ${line_notice} == "  <summary>${{ steps.version.outputs.text }}</summary>" ]]
          then
            state_notice=1
          elif [ "${state_notice}" = 1 ] && [[ ${line_notice} == "  </details>" ]]
          then
            break
          elif [ "${state_notice}" = 1 ] && [ -n "${line_notice}" ]
          then
            printf "%s\n" "${line_notice#  }" >> notes.md
          fi
        done < NOTICE.md
        touch notes.md
    - name: Publish release
      run: |
        # one release carries the latest build of main under its date version
        gh release delete "${{ steps.version.outputs.text }}" --cleanup-tag --yes || true
        gh release create "${{ steps.version.outputs.text }}" packages/* --target "${GITHUB_SHA}" --title "StudWorx ${{ steps.version.outputs.text }}" --notes-file notes.md --latest
        # earlier date versions are removed with their tags
        mapfile -t tags_release < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
        for tag_release in "${tags_release[@]}"
        do
          if [ "${tag_release}" != "${{ steps.version.outputs.text }}" ]
          then
            gh release delete "${tag_release}" --cleanup-tag --yes
          fi
        done
