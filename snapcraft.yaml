name: studworx
base: core18
adopt-info: studworx
version: '2026-11-01'
grade: stable
confinement: strict

apps:
  studworx:
    common-id: io.github.nathaneltitane.StudWorx
    command: studworx
    plugs:
      - home
      - opengl
      - network
    extensions:
      - kde-neon

parts:
  studworx:
    plugin: qmake
    build-packages:
      - g++
      - make
      - qtbase5-dev
      - qttools5-dev-tools
      - libqt5opengl5-dev
      - zlib1g-dev
    stage-packages:
      - libqt5opengl5
      - libqt5gui5
      - libqt5concurrent5
      - libqt5printsupport5
      - libqt5xml5
      - libqt5svg5
      - qt5-image-formats-plugins
    source: https://github.com/nathaneltitane/studworx/archive/refs/tags/2026-11-01.tar.gz
    parse-info: [usr/share/metainfo/io.github.nathaneltitane.StudWorx.appdata.xml]
